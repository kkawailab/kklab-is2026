    <input type="text" id="v-name" autocomplete="off">

    <label for="v-time">提出時間(表示どおり)</label>
    <input type="text" id="v-time" autocomplete="off" placeholder="2026年8月15日 14:03:22">

    <label for="v-code">確認コード</label>
    <input type="text" id="v-code" autocomplete="off" placeholder="XXXX-XXXX">

    <button type="button" onclick="verify()">照合する</button>

    <div class="verdict" id="verdict"></div>
  </div>

  <script src="code.js"></script>
  <script>
    async function verify() {
      var pageId = document.getElementById("v-page").value;
      var id = document.getElementById("v-id").value;
      var name = document.getElementById("v-name").value;
      var timeText = document.getElementById("v-time").value;
      var code = document.getElementById("v-code").value.trim().toUpperCase();
      var box = document.getElementById("verdict");

      if (!id.trim() || !name.trim() || !timeText.trim() || !code) {
        box.className = "verdict ng";
        box.textContent = "すべての欄を入力してください。";
        box.style.display = "block";
        return;
      }

      var expected = await computeCode(pageId, id, name, timeText);
      if (expected === code) {
        box.className = "verdict ok";
        box.textContent = "✓ 一致(改ざんは検出されませんでした)";
      } else {
        box.className = "verdict ng";
        box.textContent = "✗ 不一致(内容が書き換えられている可能性があります)";
      }
      box.style.display = "block";
    }
  </script>
