<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出席確認① AIの常識クイズ | NCU IS2026 / 情報システム論</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      background: #f5f6f8;
      color: #1f2933;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      padding: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    .lead {
      color: #52606d;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    fieldset {
      border: none;
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.6rem 0.8rem;
      font-size: 1rem;
      border: 1px solid #cbd2d9;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .question {
      background: #f5f6f8;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .question p {
      font-weight: 700;
      margin-bottom: 0.6rem;
    }
    .question .choice {
      display: block;
      font-weight: 400;
      margin-bottom: 0.4rem;
      cursor: pointer;
    }
    .question input[type="radio"] {
      margin-right: 0.5rem;
    }
    button {
      display: block;
      width: 100%;
      padding: 0.8rem;
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    .error {
      display: none;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 0.8rem 1rem;
      margin-bottom: 1rem;
      font-weight: 700;
    }
    #result {
      display: none;
      text-align: center;
    }
    #result h2 {
      font-size: 1.4rem;
      color: #15803d;
      margin-bottom: 1.2rem;
    }
    .result-table {
      margin: 0 auto 1.5rem;
      border-collapse: collapse;
      text-align: left;
    }
    .result-table th,
    .result-table td {
      padding: 0.6rem 1rem;
      border-bottom: 1px solid #e4e7eb;
    }
    .result-table th {
      color: #52606d;
      font-weight: 700;
      white-space: nowrap;
    }
    .notice {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 1rem;
      font-weight: 700;
      color: #1e40af;
    }
    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
      color: #2563eb;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="form-page">
      <h1>出席確認① AIの常識クイズ</h1>
      <p class="lead">学籍番号と氏名を入力し、3つのクイズすべてに回答して「提出する」を押してください。</p>

      <div class="error" id="error-box"></div>

      <fieldset>
        <label for="student-id">学籍番号</label>
        <input type="text" id="student-id" autocomplete="off" placeholder="例: 26123456">

        <label for="student-name">氏名（フルネーム）</label>
        <input type="text" id="student-name" autocomplete="off" placeholder="例: 名城 太郎">
      </fieldset>

      <fieldset>
        <div class="question" id="q1">
          <p>Q1. 「AI」は何の略でしょうか？</p>
          <label class="choice"><input type="radio" name="q1" value="a">Automatic Internet</label>
          <label class="choice"><input type="radio" name="q1" value="b">Artificial Intelligence</label>
          <label class="choice"><input type="radio" name="q1" value="c">Advanced Information</label>
        </div>

        <div class="question" id="q2">
          <p>Q2. ChatGPT や Claude のように、文章や画像などを新しく作り出すAIは何と呼ばれるでしょうか？</p>
          <label class="choice"><input type="radio" name="q2" value="a">生成AI（ジェネレーティブAI）</label>
          <label class="choice"><input type="radio" name="q2" value="b">検索エンジン</label>
          <label class="choice"><input type="radio" name="q2" value="c">表計算ソフト</label>
        </div>

        <div class="question" id="q3">
          <p>Q3. AIの回答についての説明として、正しいものはどれでしょうか？</p>
          <label class="choice"><input type="radio" name="q3" value="a">AIの回答は常に100%正しい</label>
          <label class="choice"><input type="radio" name="q3" value="b">AIは事実と異なる内容を答えることがあるため、確認が必要である</label>
          <label class="choice"><input type="radio" name="q3" value="c">AIは質問に一切答えることができない</label>
        </div>
      </fieldset>

      <button type="button" onclick="submitQuiz()">提出する</button>
    </div>

    <div id="result">
      <h2>全問正解です！出席を確認しました</h2>
      <table class="result-table">
        <tr><th>学籍番号</th><td id="result-id"></td></tr>
        <tr><th>氏名</th><td id="result-name"></td></tr>
        <tr><th>提出時間</th><td id="result-time"></td></tr>
      </table>
      <p class="notice">この画面のスクリーンショットを撮り、Teams の提出欄にアップロードしてください。</p>
    </div>

    <a class="back-link" href="index.html">← トップページに戻る</a>
  </div>

  <script>
    var answers = { q1: "b", q2: "a", q3: "b" };

    function getChecked(name) {
      var checked = document.querySelector('input[name="' + name + '"]:checked');
      return checked ? checked.value : null;
    }

    function showError(message) {
      var box = document.getElementById("error-box");
      box.textContent = message;
      box.style.display = "block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function resetQuiz() {
      var radios = document.querySelectorAll('input[type="radio"]');
      for (var i = 0; i < radios.length; i++) {
        radios[i].checked = false;
      }
    }

    function submitQuiz() {
      var id = document.getElementById("student-id").value.trim();
      var name = document.getElementById("student-name").value.trim();

      if (!id || !name) {
        showError("学籍番号と氏名を入力してください。");
        return;
      }

      var q1 = getChecked("q1");
      var q2 = getChecked("q2");
      var q3 = getChecked("q3");

      if (!q1 || !q2 || !q3) {
        showError("すべてのクイズに回答してください。");
        return;
      }

      if (q1 === answers.q1 && q2 === answers.q2 && q3 === answers.q3) {
        var now = new Date();
        var pad = function (n) { return String(n).padStart(2, "0"); };
        var timeText = now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日 " +
          pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());

        document.getElementById("result-id").textContent = id;
        document.getElementById("result-name").textContent = name;
        document.getElementById("result-time").textContent = timeText;
        document.getElementById("form-page").style.display = "none";
        document.getElementById("result").style.display = "block";
        window.scrollTo(0, 0);
      } else {
        resetQuiz();
        showError("間違いがあります。再チャレンジしてください。");
      }
    }
  </script>
</body>
</html>
